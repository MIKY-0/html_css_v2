<!-- 상단(Header): 로고는 왼쪽, 내비게이션 메뉴는 오른쪽에 배치 (Flexbox 활용).
중앙(Hero): 서비스의 핵심 문구를 중앙 정렬하여 배치.
하단(Features): 3개의 카드 섹션을 가로로 균등하게 배치 (Flexbox 활용). -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h3><span class="brand">BRAND</span><span class="logo">LOGO</span></h3>
      <nav>
        <div class="menu">
          <span>소개</span>
          <span>서비스</span>
          <span>문의하기</span>
        </div>
      </nav>
    </header>

    <main>
      <div class="title">
        <h1>더 나은 미래를 만드는 혁신</h1>
        <p>우리는 가장 단순한 방법으로 최고의 가치를 전달합니다.</p>
      </div>

      <div class="container">
        <div class="card">
          <h3>
            <h1>🚀</h1>
            빠른속도
          </h3>
          <p>최신 기술을 활용하여 가장 빠른 퍼포먼스를 보장합니다.</p>
        </div>
        <div class="card">
          <h3>
            <h1>💎</h1>
            높은 품질
          </h3>
          <p>정교한 코드와 디자인으로 최상의 결과물을 제공합니다.</p>
        </div>
        <div class="card">
          <h3>
            <h1>🤝</h1>
            고객 신뢰
          </h3>
          <p>언제나 고객의 목소리에 귀를 기울이며 함께 성장합니다.</p>
        </div>
      </div>

      <footer>
        <p>&copy; 2026 Brand Design. All rights reserved.</p>
      </footer>
    </main>
  </body>
</html>
